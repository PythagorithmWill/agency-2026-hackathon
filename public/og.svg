<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-label="Glassbox — See through the spend."
>
  <defs>
    <radialGradient id="atm-tl" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="atm-br" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0A0A0A" />
  <rect width="1200" height="630" fill="url(#atm-tl)" />
  <rect width="1200" height="630" fill="url(#atm-br)" />

  <!-- Glassbox mark, top-left -->
  <g transform="translate(72, 72)">
    <rect x="0" y="0" width="56" height="56" rx="3" fill="none" stroke="#FAFAFA" stroke-width="2" />
    <line x1="6" y1="20" x2="50" y2="20" stroke="#FAFAFA" stroke-width="1.5" stroke-opacity="0.45" />
    <line x1="6" y1="28" x2="50" y2="28" stroke="#FAFAFA" stroke-width="1.5" stroke-opacity="0.45" />
    <line x1="6" y1="36" x2="50" y2="36" stroke="#FAFAFA" stroke-width="1.5" stroke-opacity="0.45" />
    <circle cx="28" cy="28" r="2.6" fill="#5EEAD4" />
  </g>

  <!-- "glassbox" wordmark next to mark — the "o" in "box" is rendered
       as a 3D wireframe cube to signal transparency. -->
  <text
    x="148"
    y="118"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="-0.02em"
  >glassb</text>
  <!-- 3D wireframe cube replacing the "o" in "box" -->
  <g transform="translate(285, 76) scale(0.42)" stroke="#FAFAFA" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front face -->
    <path d="M 18 38 L 18 88 L 68 88 L 68 38 Z" />
    <!-- Top face -->
    <path d="M 18 38 L 38 18 L 88 18 L 68 38" />
    <!-- Right face -->
    <path d="M 68 38 L 88 18 L 88 68 L 68 88" />
    <!-- Hidden edges -->
    <g stroke-width="4" opacity="0.35">
      <path d="M 38 18 L 38 68 L 18 88" stroke-dasharray="3 4" />
      <path d="M 38 68 L 88 68" stroke-dasharray="3 4" />
    </g>
  </g>
  <text
    x="335"
    y="118"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="-0.02em"
  >x</text>

  <!-- Tagline -->
  <text
    x="72"
    y="320"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="96"
    font-weight="600"
    letter-spacing="-0.04em"
  >See through</text>
  <text
    x="72"
    y="420"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="96"
    font-weight="600"
    letter-spacing="-0.04em"
  >the spend<tspan fill="#5EEAD4">.</tspan></text>

  <!-- Dek -->
  <text
    x="72"
    y="500"
    fill="#A1A1AA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="22"
    font-style="italic"
  >Prospective accountability for federal and provincial spending.</text>

  <!-- Metadata strip bottom-left -->
  <text
    x="72"
    y="566"
    fill="#71717A"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="14"
    letter-spacing="0.12em"
  >FEDERAL  ·  ALBERTA  ·  AUDIT-READY</text>

  <!-- Bottom-right: Pythagorithm attribution + version -->
  <text
    x="1128"
    y="566"
    fill="#71717A"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="14"
    letter-spacing="0.12em"
    text-anchor="end"
  >v0.3  ·  Built on the Pythagorithm Proof Methodology</text>
</svg>
