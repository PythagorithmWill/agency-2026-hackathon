<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-label="Glassbox — See through the spend."
>
  <defs>
    <radialGradient id="bg-accent-tl" cx="22%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-accent-br" cx="82%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cube-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#5EEAD4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>
    <filter id="cube-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="4" result="shadow" />
      <feComponentTransfer><feFuncA type="linear" slope="0.6" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background: deep ink with two cyan glow accents -->
  <rect width="1200" height="630" fill="#0A0A0A" />
  <rect width="1200" height="630" fill="url(#bg-accent-tl)" />
  <rect width="1200" height="630" fill="url(#bg-accent-br)" />

  <!-- Vertical column rules (subtle grid texture) -->
  <g stroke="#27272A" stroke-width="1" opacity="0.5">
    <line x1="600" y1="0" x2="600" y2="630" />
  </g>

  <!-- ============== LEFT COLUMN: wordmark + tagline + meta ============== -->

  <!-- Mono uptag: who/what -->
  <text
    x="72"
    y="86"
    fill="#71717A"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="14"
    letter-spacing="0.16em"
  >GLASSBOX · TRANSPARENCY PLATFORM</text>

  <!-- Wordmark: "glassb[cube]x" -->
  <text
    x="72"
    y="200"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="84"
    font-weight="600"
    letter-spacing="-0.035em"
  >glassb</text>

  <!-- 3D wireframe cube replacing the "o" in "glassbox" -->
  <g transform="translate(322, 142)" filter="url(#cube-shadow)">
    <!-- soft glow halo behind the cube -->
    <circle cx="38" cy="34" r="50" fill="url(#cube-glow)" />
    <!-- cube edges, isometric outline -->
    <g stroke="#FAFAFA" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Front face -->
      <path d="M 8 26 L 8 70 L 52 70 L 52 26 Z" />
      <!-- Top face -->
      <path d="M 8 26 L 26 8 L 70 8 L 52 26" />
      <!-- Right face -->
      <path d="M 52 26 L 70 8 L 70 52 L 52 70" />
      <!-- Hidden edges -->
      <g stroke-width="2.2" opacity="0.4">
        <path d="M 26 8 L 26 52 L 8 70" stroke-dasharray="3 4" />
        <path d="M 26 52 L 70 52" stroke-dasharray="3 4" />
      </g>
    </g>
  </g>

  <text
    x="402"
    y="200"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="84"
    font-weight="600"
    letter-spacing="-0.035em"
  >x</text>

  <!-- Tagline (large, multi-line) -->
  <text
    x="72"
    y="328"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="56"
    font-weight="600"
    letter-spacing="-0.025em"
  >See through</text>
  <text
    x="72"
    y="394"
    fill="#FAFAFA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="56"
    font-weight="600"
    letter-spacing="-0.025em"
  >the spend<tspan fill="#5EEAD4">.</tspan></text>

  <!-- Italic dek -->
  <text
    x="72"
    y="448"
    fill="#A1A1AA"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-size="20"
    font-style="italic"
  >Prospective accountability for federal &amp; Alberta provincial spending.</text>

  <!-- Bottom mono strip -->
  <line x1="72" y1="528" x2="540" y2="528" stroke="#27272A" stroke-width="1" />
  <text
    x="72"
    y="562"
    fill="#A1A1AA"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="13"
    letter-spacing="0.12em"
  >1.27M FEDERAL  ·  2.05M ALBERTA  ·  9 LIVE PATTERNS</text>
  <text
    x="72"
    y="586"
    fill="#71717A"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="12"
    letter-spacing="0.12em"
  >EVERY CLAIM CITES ITS SOURCE ROW</text>

  <!-- ============== RIGHT COLUMN: hero cube ============== -->

  <!-- Big focal cube — the 3D wireframe, centered in the right half -->
  <g transform="translate(880, 315)">
    <!-- ambient glow behind the cube -->
    <circle cx="0" cy="0" r="220" fill="url(#cube-glow)" />
    <!-- cube, scaled large -->
    <g stroke="#FAFAFA" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cube-shadow)">
      <!-- Front face -->
      <path d="M -100 -50 L -100 110 L 60 110 L 60 -50 Z" />
      <!-- Top face -->
      <path d="M -100 -50 L -40 -110 L 120 -110 L 60 -50" />
      <!-- Right face -->
      <path d="M 60 -50 L 120 -110 L 120 50 L 60 110" />
      <!-- Hidden edges (dashed) -->
      <g stroke-width="3" opacity="0.42">
        <path d="M -40 -110 L -40 50 L -100 110" stroke-dasharray="6 7" />
        <path d="M -40 50 L 120 50" stroke-dasharray="6 7" />
      </g>
    </g>

    <!-- accent dot at the cube's front face (signal of "transparency seen") -->
    <circle cx="-20" cy="30" r="6" fill="#5EEAD4" />
  </g>

  <!-- Bottom-right attribution -->
  <text
    x="1128"
    y="586"
    fill="#71717A"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="12"
    letter-spacing="0.12em"
    text-anchor="end"
  >glassbox.pythagorithm.ai</text>
</svg>
